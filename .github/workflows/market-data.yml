name: market-data
on:
  schedule:
    # Off the top of the hour (GitHub delays or drops :00 schedules under load), two slots for redundancy.
    # 07:17 and 07:47 Riyadh. The second slot is a no-op once market_data.json has today's generatedAt.
    - cron: "17 4 * * *"
    - cron: "47 4 * * *"
  # Primary trigger: a Claude routine appends a line to triggers/market-data.txt and pushes (GitHub's cron is hours late
  # or skipped for this repo). Bot commits never touch triggers/, so nothing loops.
  push:
    branches: [main]
    paths: ["triggers/market-data.txt"]
  workflow_dispatch:
    inputs:
      force:
        description: "Refetch even if market_data.json is already from today"
        type: boolean
        default: false
      check_only:
        description: "Only cross-check today's prices (previous download and second source); fetch and commit nothing"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-check only
        if: inputs.check_only
        run: python3 crosscheck.py
      - name: Schedule heartbeat
        if: github.event_name == 'schedule' || github.event_name == 'push'
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ github.event_name }} cron=\"$CRON\"" >> heartbeat.log
          tail -n 30 heartbeat.log > heartbeat.tmp && mv heartbeat.tmp heartbeat.log
          tail -n 1 heartbeat.log
      - name: Fetch market data
        if: ${{ !inputs.check_only }}
        id: fetch
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 fetch_market_data.py
      - name: Build series.json
        if: ${{ !inputs.check_only }}
        id: series
        run: python3 make_series.py
      - name: FX rates
        if: ${{ !inputs.check_only }}
        id: fx
        continue-on-error: true
        run: python3 fetch_fx.py
      - name: Tadawul prices
        if: ${{ !inputs.check_only }}
        id: tadawul
        continue-on-error: true
        run: python3 fetch_tadawul.py
      - name: Commit
        # always() so the heartbeat is recorded even when the fetch fails; market data is only
        # committed when both data steps succeeded
        if: always() && !inputs.check_only
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          if [ -f heartbeat.log ]; then git add heartbeat.log; fi
          msg="heartbeat $(date -u +%Y-%m-%d)"
          if [ "${{ steps.tadawul.outcome }}" = success ] && [ -f tadawul_series.json ]; then git add tadawul_series.json; fi
          if [ "${{ steps.fx.outcome }}" = success ] && [ -f fx_rates.json ]; then git add fx_rates.json; fi
          if [ "${{ steps.fetch.outcome }}" = success ] && [ "${{ steps.series.outcome }}" = success ]; then
            git add market_data.json series.json market_data/
            msg="market data $(date -u +%Y-%m-%d)"
          fi
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "$msg"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 5))
          done
          exit 1
