<title>Client Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: navy masthead + tab rail; overview = KPI strip, allocation band, two-column lists; client = tiles + collapsible asset-class ledgers */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EBEFF5; --ink:#142036; --muted:#5B6880; --line:#DCE2EB;
  --bar:#1B2A4A; --bar-ink:#F1F4FA; --bar-muted:#A9B6CC;
  --accent:#4A6FA5; --accent-ink:#FFFFFF; --slate:#8A9BB0;
  --pos:#1D7A4E; --neg:#B23A3A; --warn:#A66A12; --pos-bg:#E5F3EC; --neg-bg:#F8E7E7; --warn-bg:#F7EEDC; --info-bg:#E6EDF7;
  --c1:#1B2A4A; --c2:#4A6FA5; --c3:#8A9BB0; --c4:#2E8A86; --c5:#B98A2E; --c6:#7B5EA7;
  --f-display:"Source Serif 4",Cambria,Georgia,serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1422; --surface:#141E31; --sunk:#101929; --ink:#E4E9F2; --muted:#94A1B7; --line:#24314A;
  --bar:#0A101C; --bar-ink:#E9EEF7; --bar-muted:#8D9BB3;
  --accent:#7FA2D6; --accent-ink:#0D1422; --slate:#7D8DA5;
  --pos:#5CC08E; --neg:#E57D7D; --warn:#D9A347; --pos-bg:#14301F; --neg-bg:#3A1A1C; --warn-bg:#352812; --info-bg:#18273F;
  --c1:#A9C1E8; --c2:#5F8BCB; --c3:#8D9BB3; --c4:#49B3AC; --c5:#D3A94F; --c6:#A58BD0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#141E31; --sunk:#101929; --ink:#E4E9F2; --muted:#94A1B7; --line:#24314A;
  --bar:#0A101C; --bar-ink:#E9EEF7; --bar-muted:#8D9BB3;
  --accent:#7FA2D6; --accent-ink:#0D1422; --slate:#7D8DA5;
  --pos:#5CC08E; --neg:#E57D7D; --warn:#D9A347; --pos-bg:#14301F; --neg-bg:#3A1A1C; --warn-bg:#352812; --info-bg:#18273F;
  --c1:#A9C1E8; --c2:#5F8BCB; --c3:#8D9BB3; --c4:#49B3AC; --c5:#D3A94F; --c6:#A58BD0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
.mast-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.01em}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bar-muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:var(--bar-ink);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--slate);flex:none}
.dot.ok{background:#4FC08A}.dot.err{background:#E06A6A}.dot.busy{background:#E0B54F}
.mast button,.mast .seg{font:inherit}
.btn{font:500 13px/1 var(--f-body);padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 8px;font-size:12px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.mast .btn{background:transparent;color:var(--bar-ink);border-color:rgba(255,255,255,.25)}
.mast .btn.pri{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink)}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:var(--r);overflow:hidden}
.seg button{background:transparent;color:var(--bar-muted);border:0;padding:7px 10px;font:500 12px var(--f-body);cursor:pointer}
.seg button.on{background:rgba(255,255,255,.14);color:var(--bar-ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.08)}
.tab{background:none;border:0;color:var(--bar-muted);font:500 13px var(--f-body);padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--bar-ink);border-bottom-color:var(--bar-ink)}
main{padding-block:20px 60px;display:grid;gap:18px}
main>*{min-width:0}
details.cls{min-width:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2,.panel-h h3{margin-right:auto}
.panel-b{padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-num);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num,td .num{white-space:nowrap}
tfoot td{font-weight:600;background:var(--sunk)}
.linkish{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--accent)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);vertical-align:1px;white-space:nowrap}
.tag.ov{background:var(--warn-bg);color:var(--warn)}
.tag.ib{background:var(--info-bg);color:var(--accent)}
.tag.rh{background:var(--pos-bg);color:var(--pos)}
.tag.bad{background:var(--neg-bg);color:var(--neg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)}.pill.neg{background:var(--neg-bg);color:var(--neg)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.alloc{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.list{display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:start}
.li:last-child{border-bottom:0}
.li .when{font-family:var(--f-num);font-size:12px;color:var(--muted);min-width:52px}
.sev{width:4px;align-self:stretch;border-radius:2px;background:var(--slate)}
.sev.neg{background:var(--neg)}.sev.warn{background:var(--warn)}.sev.info{background:var(--accent)}
.empty{padding:22px 14px;color:var(--muted);display:grid;gap:8px;justify-items:start}
details.cls{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.cls>summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 14px;cursor:pointer}
details.cls>summary::-webkit-details-marker{display:none}
details.cls>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.cls[open]>summary::before{transform:rotate(45deg)}
details.cls>summary h3{margin-right:auto}
details.cls[open]>summary{border-bottom:1px solid var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.menu{position:relative;display:inline-block}
.menu>summary{list-style:none;cursor:pointer}
.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(10,20,40,.18);display:grid;min-width:200px;padding:4px}
.menu-pop button{background:none;border:0;text-align:left;padding:8px 10px;font:13px var(--f-body);color:var(--ink);cursor:pointer;border-radius:4px}
.menu-pop button:hover{background:var(--sunk)}
.range{position:relative;height:6px;border-radius:3px;background:var(--sunk);margin:6px 0 4px;min-width:120px}
.range i{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink)}
.range b{position:absolute;top:-3px;width:2px;height:12px;background:var(--accent)}
.bars{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.banner{padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.banner.warn{background:var(--warn-bg);border-color:transparent}
.banner.neg{background:var(--neg-bg);border-color:transparent}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.skill code{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 9px;width:100%;min-width:0}
textarea{font-family:var(--f-body);line-height:1.5;resize:vertical}
textarea.out{font-family:var(--f-num);font-size:12.5px;min-height:320px;background:var(--surface)}
.modal-bg{position:fixed;inset:0;background:rgba(8,14,26,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:8px;width:min(860px,100%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h2{margin-right:auto}
.modal-b{padding:16px;display:grid;gap:14px}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.note{font-size:12px;color:var(--muted)}
.statusline{font-size:12px;color:var(--muted);min-height:18px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r);font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.hdr-client{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px}
.hdr-client h1{margin-right:auto}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){h1{font-size:22px}.kpi .v{font-size:18px}.brand span{display:none}}
</style>

<header class="mast">
  <div class="wrap mast-in">
    <div class="brand"><b>Client Portal</b><span>Audi Capital · Wealth Management Advisory</span></div>
    <div class="chips" id="connChips"></div>
    <div class="seg" role="group" aria-label="Display currency"><button id="ccyUSD" data-act="ccy" data-v="USD" class="on">USD</button><button id="ccySAR" data-act="ccy" data-v="SAR">SAR</button></div>
    <button class="btn pri" id="refreshBtn" data-act="refresh">Refresh</button>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" aria-label="Sections"></nav></div>
</header>
<div class="wrap"><main id="main"></main></div>
<div id="modalRoot"></div>

<script>
(() => {
"use strict";
// ---------- constants ----------
const IB = "Interactive Brokers IBKR", RH = "Robinhood MCP", GM = "Gmail";
const SAR_PER_USD = 3.75;
const AC = {
  cash:{label:"Cash & Time Deposits", c:"--c3"}, equity:{label:"Equity", c:"--c2"}, fi:{label:"Fixed Income", c:"--c1"},
  pe:{label:"Private Equity", c:"--c6"}, option:{label:"Options", c:"--c5"}, sp:{label:"Structured Products", c:"--c4"}
};
const AC_ORDER = ["cash","fi","equity","sp","pe","option"];
const DEF_TH = {dayMove:3, earnDays:5, cpnDays:7, barrierPts:10, optDays:14, navDays:90, ovDays:30};

// ---------- state ----------
const S = {
  view:"overview", clientId:null, ccy:"USD",
  clients:{}, accounts:{}, holdings:{}, overrides:{}, drafts:{}, snapshots:{}, audit:{}, settings:{}, pt:{},
  dbReady:false, dbState:"pending", mcpState:"pending", sampleOK:false, me:null,
  live:{
    ib:{status:"idle", positions:null, summary:null, perf:null, at:null, err:null},
    rh:{status:"idle", accounts:null, accts:{}, at:null, err:null},
    quotes:{}, optInst:{}, optQuotes:{}, rat:{}, earn:{}, filings:{}, dataStatus:"idle", dataErr:null
  },
  refreshing:false, lastRefresh:null
};
let mcp=null, db=null, user=null, sample=null;

// ---------- utils ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = typeof v === "number" ? v : parseFloat(v); return isFinite(n) ? n : null; };
const nf0 = new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const disp = v => v == null ? null : (S.ccy === "SAR" ? v * SAR_PER_USD : v);
const money = v => v == null || !isFinite(v) ? "–" : nf0.format(v);
const dmoney = v => money(disp(v));
const px = v => v == null || !isFinite(v) ? "–" : (Math.abs(v) >= 1000 ? nf2.format(v) : (+v).toFixed(Math.abs(v) < 10 ? 3 : 2));
const pct = (v,d=2) => v == null || !isFinite(v) ? "–" : (v > 0 ? "+" : "") + (v*100).toFixed(d) + "%";
const cls = v => v == null || !isFinite(v) || Math.abs(v) < 1e-9 ? "" : (v > 0 ? "pos" : "neg");
const iso = d => { const z = new Date(d); return z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0")+"-"+String(z.getDate()).padStart(2,"0"); };
const TODAY = () => iso(new Date());
const pd = s => { if(!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const days = (a,b) => Math.round((pd(b) - pd(a)) / 864e5);
const addMonths = (s,n) => { const d = pd(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return iso(d); };
const fmtD = s => { const d = pd(s); return d ? d.toLocaleDateString("en-US",{day:"2-digit",month:"short",year:"numeric"}) : "–"; };
const fmtDs = s => { const d = pd(s); return d ? d.toLocaleDateString("en-US",{day:"2-digit",month:"short"}) : "–"; };
const fmtT = t => t ? new Date(t).toLocaleString("en-US",{month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "–";
const mask = a => "••••" + String(a).slice(-4);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const th = () => ({...DEF_TH, ...(S.settings.thresholds||{})});
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function fxUSD(ccy){ ccy=(ccy||"USD").toUpperCase(); if(ccy==="USD") return 1; if(ccy==="SAR") return 1/SAR_PER_USD; const r=num((S.settings.fx||{})[ccy]); return r && r>0 ? r : null; }

let rq=false; function render(){ if(rq) return; rq=true; requestAnimationFrame(()=>{ rq=false; draw(); }); }

// ---------- connector calls ----------
const ERR_COPY = {
  needs_reauth: s => `Reconnect ${s} in claude.ai Settings → Connectors.`,
  server_not_connected: s => `Add ${s} in claude.ai Settings → Connectors.`,
  selection_required: s => `Choose which ${s} connector this page should use.`,
  not_in_manifest: s => `${s} is turned off for this page. Allow it from the artifact's Permissions menu.`,
  approval_required: s => `${s} needs your approval. Press Refresh to be asked again.`,
  blocked_by_policy: s => `Your organization blocks ${s} here.`,
  server_unavailable: s => `${s} did not answer. Try Refresh in a minute.`,
  tool_error: (s,e) => `${s} reported an error: ${e.message||"no detail"}.`,
};
const errText = (s,e) => (ERR_COPY[e?.code] || (() => `${s} is unavailable right now (${e?.code||"error"}).`))(s,e);
async function call(server, tool, input, force, stale){
  const opt = {cache: force ? {refresh:true, staleTime:0, gcTime:864e5} : {staleTime: stale ?? 15*60e3, gcTime:864e5}};
  try { const r = await mcp.callTool(server, tool, input, opt); return {p:r.payload, at:r.cache?.storedAt || Date.now()}; }
  catch(e){
    if(e?.retryable){ await sleep((e.retryAfterMs||800) + Math.random()*700); const r = await mcp.callTool(server, tool, input, opt); return {p:r.payload, at:r.cache?.storedAt || Date.now()}; }
    throw e;
  }
}
async function pool(items, n, fn){ const q=[...items]; await Promise.all(Array.from({length:Math.min(n,q.length)}, async()=>{ while(q.length){ const it=q.shift(); try{ await fn(it); }catch(_){} } })); }

async function loadIB(force){
  const L=S.live.ib; L.status="busy"; render();
  const [pos,sum,perf] = await Promise.allSettled([call(IB,"get_account_positions",{},force), call(IB,"get_account_summary",{},force), call(IB,"get_pa_performance_all_periods",{},force,60*60e3)]);
  if(pos.status==="fulfilled"){ L.positions = pos.value.p?.positions || []; L.at = pos.value.at; L.err=null; L.status="ok"; }
  else { L.err = errText("IBKR", pos.reason); L.status="err"; if(["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy"].includes(pos.reason?.code)){ L.positions=null; } }
  if(sum.status==="fulfilled") L.summary = sum.value.p;
  if(perf.status==="fulfilled") L.perf = perf.value.p;
  render();
}
function quotePx(q){
  if(!q) return null; const a=num(q.last_trade_price), b=num(q.last_non_reg_trade_price);
  const ta=Date.parse(q.venue_last_trade_time||0)||0, tb=Date.parse(q.venue_last_non_reg_trade_time||0)||0;
  return (b!=null && tb>ta) ? b : (a ?? b);
}
async function loadQuotes(syms, force){
  const need=[...new Set(syms.filter(Boolean).map(s=>s.toUpperCase()))];
  for(const c of chunk(need,20)){
    try{ const r=await call(RH,"get_equity_quotes",{symbols:c},force,5*60e3); for(const x of r.p?.data?.results||[]){ const s=x?.quote?.symbol; if(s) S.live.quotes[s]={...x.quote, close:x.close, px:quotePx(x.quote), at:r.at}; } }catch(e){ S.live.dataErr=errText("Robinhood",e); }
  }
}
async function loadRH(force){
  const L=S.live.rh; L.status="busy"; render();
  try{
    const a = await call(RH,"get_accounts",{},force,60*60e3);
    L.accounts = (a.p?.data?.accounts||[]).filter(x=>!x.deactivated);
    const accts={};
    await Promise.all(L.accounts.map(async acc=>{
      const no=acc.account_number; const o={positions:[], options:[], portfolio:null, err:null};
      try{
        let cur=null, guard=0; do{ const r=await call(RH,"get_equity_positions",cur?{account_number:no,cursor:cur}:{account_number:no},force); o.positions.push(...(r.p?.data?.positions||[])); cur=r.p?.data?.next||null; }while(cur && ++guard<6);
        const op=await call(RH,"get_option_positions",{account_number:no,nonzero:true},force); o.options=(op.p?.data?.positions||[]).filter(x=>num(x.quantity));
        const pf=await call(RH,"get_portfolio",{account_number:no},force); o.portfolio=pf.p?.data||null;
      }catch(e){ o.err=errText("Robinhood",e); }
      accts[no]=o;
    }));
    L.accts=accts; L.at=Date.now(); L.err=null; L.status="ok";
    const anyErr=Object.values(accts).find(x=>x.err); if(anyErr){ L.err=anyErr.err; L.status="err"; }
    render();
    // quotes for held equities
    const syms=[]; for(const o of Object.values(accts)) for(const p of o.positions) syms.push(p.symbol);
    await loadQuotes(syms, force);
    // options
    const ids=[]; for(const o of Object.values(accts)) for(const p of o.options) ids.push(p.option_id);
    for(const c of chunk(ids,20)){
      try{ const r=await call(RH,"get_option_instruments",{ids:c.join(",")},force,12*60*60e3); for(const i of r.p?.data?.instruments||[]) S.live.optInst[i.id]=i; }catch(_){}
      try{ const r=await call(RH,"get_option_quotes",{instrument_ids:c},force,5*60e3); for(const q of r.p?.data?.results||[]) S.live.optQuotes[q.quote?.instrument_id]={...q, at:r.at}; }catch(_){}
    }
  }catch(e){ L.err=errText("Robinhood",e); L.status="err"; if(["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy"].includes(e?.code)){ L.accounts=null; L.accts={}; } }
  render();
}
function equitySymbols(){
  const set=new Set();
  for(const p of buildPositions()){ if(p.ac==="equity" && p.sym && /^[A-Z.]{1,6}$/.test(p.sym)) set.add(p.sym); if(p.ac==="option" && p.x?.under) set.add(p.x.under); if(p.ac==="sp") for(const u of p.x?.unders||[]) set.add(u.sym); }
  return [...set];
}
async function loadMarket(force){
  S.live.dataStatus="busy"; S.live.dataErr=null; render();
  const syms=equitySymbols();
  // quotes for manual equities, SP underlyings, option underlyings and IBKR stocks not already quoted
  await loadQuotes(syms.filter(s=>force || !S.live.quotes[s]), force);
  for(const c of chunk(syms,75)){
    try{ const r=await call(RH,"get_equity_analyst_ratings",{symbols:c},force,6*60*60e3); (r.p?.data?.results||[]).forEach((x,i)=>{ S.live.rat[x?.symbol||c[i]] = x?.ratings || null; }); }catch(e){ S.live.dataErr=errText("Robinhood",e); }
  }
  render();
  await pool(syms, 4, async s=>{ const r=await call(RH,"get_earnings_results",{symbol:s},false,12*60*60e3); S.live.earn[s]=r.p?.data?.results||[]; });
  S.live.dataStatus = S.live.dataErr ? "err" : "ok"; render();
}
async function refresh(force){
  if(!mcp || S.refreshing) return;
  S.refreshing=true; render();
  await Promise.all([loadIB(force), loadRH(force)]);
  await loadMarket(force);
  S.refreshing=false; S.lastRefresh=Date.now();
  if(force) await afterRefreshWrites();
  render();
}

// ---------- persistence ----------
function sub(path, into){
  db.collection(path).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]={...d.data(), id:d.id}; }); S[into]=o; S.dbReady=true; render(); }, e=>{ S.dbState="err:"+e.code; render(); });
}
async function afterRefreshWrites(){
  if(!db || !S.dbReady) return;
  const okIB = S.live.ib.status==="ok", okRH = S.live.rh.status==="ok";
  // value snapshots (only when both connectors answered, so totals are complete)
  if(okIB && okRH){
    const t=TODAY(), agg=aggregate();
    for(const [cid,c] of Object.entries(agg.byClient)){
      if(cid==="_unassigned" || !S.clients[cid] || !(c.value>0)) continue;
      const prev=(S.snapshots[cid]?.days)||{}; if(Math.abs((prev[t]||0)-c.value)<0.5) continue;
      const dd={...prev,[t]:Math.round(c.value*100)/100}; const keys=Object.keys(dd).sort(); while(keys.length>800) delete dd[keys.shift()];
      try{ await db.doc("snapshots/"+cid).set({days:dd}); }catch(_){}
    }
  }
  // price-target history, used for the "PT cut" alert
  const cur={...S.pt}; let changed=false; const t=TODAY();
  for(const [s,r] of Object.entries(S.live.rat)){
    const m=num(r?.mean_price_target); if(m==null) continue; const o=cur[s];
    if(!o){ cur[s]={mean:m, at:t}; changed=true; }
    else if(Math.abs(o.mean-m)>0.005){ cur[s]={mean:m, prevMean:o.mean, changedAt:t, at:t}; changed=true; }
  }
  if(changed){ const {id,...rest}=cur; try{ await db.doc("meta/pt").set(rest); }catch(_){} }
}

// ---------- positions model ----------
function clientOf(key){ return S.accounts[key]?.clientId || "_unassigned"; }
function eff(key, live){ const o=S.overrides[key]; const v=num(o?.price); return v!=null ? {px:v, ov:o} : {px:live, ov:null}; }
function clsMap(sym, ac){ const m=(S.settings.classMap||{})[String(sym||"").toUpperCase()]; return AC[m] ? m : ac; }
function cpnSchedule(maturity, freq){
  const step=12/(freq||2); let next=maturity, guard=0; const t=TODAY();
  while(addMonths(next,-step) > t && guard++<400) next=addMonths(next,-step);
  return {next, last:addMonths(next,-step)};
}
function ytm(pricePct, cpn, freq, maturity){
  const t=TODAY(); if(!pricePct || !maturity || maturity<=t) return null;
  freq=freq||2; const {next,last}=cpnSchedule(maturity,freq);
  const flows=[]; let d=next, g=0; while(d<=maturity && g++<400){ flows.push(d); d=addMonths(d,12/freq); }
  const accr = cpn/freq * Math.max(0,days(last,t))/Math.max(1,days(last,next));
  const dirty = pricePct + accr; const c=cpn/freq;
  const pv = y => flows.reduce((s,dt,i)=>{ const yrs=days(t,dt)/365; return s + (c + (i===flows.length-1?100:0)) / Math.pow(1+y/freq, yrs*freq); },0);
  let lo=-0.05, hi=0.6; for(let i=0;i<80;i++){ const m=(lo+hi)/2; if(pv(m)>dirty) lo=m; else hi=m; }
  return (lo+hi)/2;
}
function parseUnders(s){ return String(s||"").split(/[,;]+/).map(x=>x.trim()).filter(Boolean).map(x=>{ const [sym,lvl]=x.split(/[:=\s]+/); return {sym:(sym||"").toUpperCase(), init:num(lvl)}; }).filter(u=>u.sym); }

function buildPositions(){
  const out=[], L=S.live, t=TODAY();
  const push = p => { p.usd = fxUSD(p.ccy); p.valueUSD = p.usd!=null && p.value!=null ? p.value*p.usd : null; p.costUSD = p.usd!=null && p.cost!=null ? p.cost*p.usd : null; p.dayUSD = p.usd!=null && p.day!=null ? p.day*p.usd : null; p.upl = p.cost ? (p.value - p.cost)/Math.abs(p.cost) : null; if(p.ac==="option" && p.cost) p.upl=(p.value-p.cost)/Math.abs(p.cost); p.dayPct = p.day!=null && p.value!=null && Math.abs(p.value-p.day)>1e-9 ? p.day/Math.abs(p.value-p.day) : null; out.push(p); };
  // IBKR
  if(L.ib.positions){
    const cid=clientOf("ibkr");

      const base={STK:"equity",OPT:"option",BOND:"fi",CASH:"cash",FUND:"equity",ETF:"equity",WAR:"option"}[p.asset_class]||"equity";
      const sym=p.contract_description, key="ib-"+p.contract_id, ac=clsMap(sym,base);
      const mult=(p.position && p.market_price) ? p.market_value/(p.position*p.market_price) : 1;
      const e=eff(key, p.market_price);
      push({key, cid, src:"IBKR", ac, name:sym, sym: base==="equity"?String(sym).toUpperCase():null, ccy:p.currency, qty:p.position, mult, livePx:p.market_price, px:e.px, ov:e.ov,
        value:p.position*e.px*mult, cost:p.market_value-(p.unrealized_pnl||0), day: e.ov?null:num(p.daily_pnl), x:{}});
    }
    const sm=L.ib.summary; const cash=num(sm?.total_cash_value);
    if(cash) push({key:"ib-cash", cid, src:"IBKR", ac:"cash", name:"IBKR cash", ccy:sm.currency||"USD", qty:null, px:null, value:cash, cost:cash, day:0, x:{kind:"cash"}});
  }
  // Robinhood
  for(const [no,o] of Object.entries(L.rh.accts||{})){
    const cid=clientOf("rh-"+no);
    for(const p of o.positions){
      const sym=p.symbol, q=L.quotes[sym], live=q?.px ?? null, prev=num(q?.adjusted_previous_close), qty=num(p.quantity), avg=num(p.average_buy_price);
      const key=`rh-${no}-${sym}`, e=eff(key, live);
      push({key, cid, src:"Robinhood", acct:no, ac:clsMap(sym,"equity"), name:sym, sym, ccy:"USD", qty, livePx:live, px:e.px, ov:e.ov,
        value: e.px!=null ? qty*e.px : null, cost: avg!=null ? qty*avg : null, day: (!e.ov && live!=null && prev!=null) ? (live-prev)*qty : null, x:{prev}});
    }
    for(const op of o.options){
      const inst=L.optInst[op.option_id]||{}, qq=L.optQuotes[op.option_id], mark=num(qq?.quote?.mark_price), close=num(qq?.close?.price) ?? num(qq?.quote?.previous_close_price);
      const sign=op.type==="short"?-1:1, mult=num(op.trade_value_multiplier)||100, qty=num(op.quantity), key="rho-"+op.option_id, e=eff(key, mark);
      const strike=num(inst.strike_price), ot=inst.type;
      push({key, cid, src:"Robinhood", acct:no, ac:"option", name:`${op.chain_symbol} ${strike!=null?strike:""} ${ot?ot[0].toUpperCase()+ot.slice(1):""} ${fmtDs(op.expiration_date)} '${String(op.expiration_date||"").slice(2,4)}`, sym:null, ccy:"USD", qty:sign*qty, mult, livePx:mark, px:e.px, ov:e.ov,
        value: e.px!=null ? sign*qty*mult*e.px : null, cost: num(op.average_price)!=null ? num(op.average_price)*qty : null,
        day: (!e.ov && mark!=null && close!=null) ? sign*qty*mult*(mark-close) : null,
        x:{under:op.chain_symbol, strike, optType:ot, expiry:op.expiration_date, side:op.type, delta: num(qq?.quote?.delta)!=null ? num(qq.quote.delta)*sign : null, iv:num(qq?.quote?.implied_volatility)}});
    }
    const cash=num(o.portfolio?.cash);
    if(cash) push({key:"rh-cash-"+no, cid, src:"Robinhood", acct:no, ac:"cash", name:"Robinhood cash "+mask(no), ccy:"USD", value:cash, cost:cash, day:0, x:{kind:"cash"}});
  }
  // Manual holdings
  for(const h of Object.values(S.holdings)){
    const key="m-"+h.id, cid=h.clientId||"_unassigned", ccy=(h.ccy||"USD").toUpperCase();
    const b={key, cid, src:"Manual", ac:h.ac, h, ccy, x:{}};
    if(h.ac==="cash"){
      const P=num(h.principal)||0;
      if(h.kind==="td"){
        const end = h.maturity && h.maturity<t ? h.maturity : t; const d=h.start? Math.max(0,days(h.start,end)) : 0;
        const accr=P*(num(h.rate)||0)/100*d/(num(h.basis)||360);
        const full=h.start&&h.maturity ? P*(num(h.rate)||0)/100*days(h.start,h.maturity)/(num(h.basis)||360) : null;

        x:{coupon:c, freq:f, maturity:h.maturity, nextCpn:sch?.next && sch.next<=h.maturity ? sch.next : null, cpnAmt:F*c/100/f, accr, ytm: e.px!=null ? ytm(e.px,c,f,h.maturity) : null, rating:h.rating, priceDate:h.priceDate}});
    } else if(h.ac==="equity"){
      const sym=(h.symbol||"").toUpperCase(), q=S.live.quotes[sym], live=q?.px ?? num(h.price), prev=num(q?.adjusted_previous_close), qty=num(h.qty)||0, e=eff(key, live);
      push({...b, name:h.name||sym, sym:sym||null, isin:h.isin, qty, livePx:live, px:e.px, ov:e.ov, value: e.px!=null? qty*e.px : null, cost: num(h.costPx)!=null ? qty*num(h.costPx) : null,
        day: (!e.ov && q?.px!=null && prev!=null) ? (q.px-prev)*qty : null, x:{manualPx: !q?.px, prev}});
    } else if(h.ac==="pe"){
      const e=eff(key, num(h.nav)), called=num(h.called)||0, dist=num(h.distributed)||0;
      push({...b, name:h.name||"PE fund", qty:null, livePx:num(h.nav), px:e.px, ov:e.ov, value:e.px, cost:called, day:null,
        x:{commitment:num(h.commitment), called, dist, navDate:h.navDate, tvpi: called ? ((e.px||0)+dist)/called : null, dpi: called? dist/called : null, unfunded: num(h.commitment)!=null ? num(h.commitment)-called : null}});
    } else if(h.ac==="sp"){
      const N=num(h.notional)||0, e=eff(key, num(h.price)), unders=parseUnders(h.underlyings);
      let worst=null; for(const u of unders){ const q=S.live.quotes[u.sym]; u.px=q?.px ?? null; u.perf = u.px!=null && u.init ? u.px/u.init : null; if(u.perf!=null && (worst==null || u.perf<worst.perf)) worst=u; }
      push({...b, name:h.name||"Structured product", isin:h.isin, qty:N, livePx:num(h.price), px:e.px, ov:e.ov, value: e.px!=null ? N*e.px/100 : null, cost: N*(num(h.costPx)??100)/100, day:null,
        x:{issuer:h.issuer, unders, worst, barrier:num(h.barrier), autocall:num(h.autocall), coupon:num(h.coupon), nextObs:h.nextObs, maturity:h.maturity,
           distB: worst && num(h.barrier)!=null ? worst.perf*100-num(h.barrier) : null, distA: worst && num(h.autocall)!=null ? worst.perf*100-num(h.autocall) : null}});
    } else if(h.ac==="option"){
      const sign=h.side==="short"?-1:1, qty=num(h.qty)||0, mult=num(h.mult)||100, e=eff(key, num(h.price));
      push({...b, name:`${(h.underlying||"").toUpperCase()} ${h.strike||""} ${h.optType==="put"?"Put":"Call"} ${fmtDs(h.expiry)} '${String(h.expiry||"").slice(2,4)}`, qty:sign*qty, mult, livePx:num(h.price), px:e.px, ov:e.ov,
        value: e.px!=null ? sign*qty*mult*e.px : null, cost: num(h.costPx)!=null ? sign*qty*mult*num(h.costPx) : null, day:null,
        x:{under:(h.underlying||"").toUpperCase(), strike:num(h.strike), optType:h.optType||"call", expiry:h.expiry, side:h.side||"long"}});

}
function aggregate(){
  const pos=buildPositions(); const byClient={}, byAC={}; let total=0, day=0, dayKnown=false, fxMissing=new Set();
  for(const p of pos){
    if(p.usd==null){ fxMissing.add(p.ccy); continue; }
    const c = byClient[p.cid] ||= {value:0, cost:0, day:0, dayKnown:false, byAC:{}, n:0};
    const v=p.valueUSD||0; c.value+=v; c.cost+=p.costUSD ?? v; c.n++; c.byAC[p.ac]=(c.byAC[p.ac]||0)+v;
    if(p.dayUSD!=null){ c.day+=p.dayUSD; c.dayKnown=true; day+=p.dayUSD; dayKnown=true; }
    byAC[p.ac]=(byAC[p.ac]||0)+v; total+=v;
  }
  return {pos, byClient, byAC, total, day, dayKnown, fxMissing:[...fxMissing]};
}
function perfOf(cid, c){
  const cl=S.clients[cid]||{}, snap=S.snapshots[cid]?.days||{}, keys=Object.keys(snap).sort(), t=TODAY();
  const mStart=t.slice(0,8)+"01", yStart=t.slice(0,4)+"-01-01", V=c.value;
  const before = lim => { const k=keys.filter(d=>d<lim); return k.length ? {v:snap[k[k.length-1]], d:k[k.length-1]} : null; };
  const firstIn = (a,b) => { const k=keys.find(d=>d>=a && d<b); return k ? {v:snap[k], d:k, partial:true} : null; };
  const mRef = before(mStart) || firstIn(mStart,t);
  const yRef = num(cl.ytdOpen) ? {v:num(cl.ytdOpen), d:yStart, manual:true} : (before(yStart) || firstIn(yStart,t));
  const fM=num(cl.flowsMtd)||0, fY=num(cl.flowsYtd)||0;
  return {
    day: c.dayKnown && Math.abs(V-c.day)>0 ? c.day/(V-c.day) : null, dayAbs: c.dayKnown ? c.day : null,
    mtd: mRef?.v ? (V-mRef.v-fM)/mRef.v : null, mtdAbs: mRef?.v ? V-mRef.v-fM : null, mRef,
    ytd: yRef?.v ? (V-yRef.v-fY)/yRef.v : null, ytdAbs: yRef?.v ? V-yRef.v-fY : null, yRef,
    inc: c.cost>0 ? (V-c.cost+(num(cl.income)||0))/c.cost : null, incAbs: c.cost>0 ? V-c.cost+(num(cl.income)||0) : null
  };
}
function nextEarn(sym){ const r=(S.live.earn[sym]||[]).find(x=>x?.eps?.actual==null && x?.report?.date>=TODAY()); return r ? {date:r.report.date, timing:r.report.timing, verified:r.report.verified, est:num(r.eps.estimate)} : null; }
function lastEarn(sym){ const r=(S.live.earn[sym]||[]).filter(x=>x?.eps?.actual!=null).pop(); return r ? {date:r.report.date, est:num(r.eps.estimate), act:num(r.eps.actual)} : null; }

// ---------- events & alerts ----------
function buildEvents(pos, horizon=30){
  const t=TODAY(), end=addMonths(t,0), lim=iso(new Date(pd(t).getTime()+horizon*864e5)), ev=[];
  const add=(date,type,p,label,amt)=>{ if(date && date>=t && date<=lim) ev.push({date,type,cid:p.cid,key:p.key,label,amt}); };
  const seenE=new Set();
  for(const p of pos){
    if(p.ac==="equity" && p.sym){ const n=nextEarn(p.sym); if(n && !seenE.has(p.cid+p.sym)){ seenE.add(p.cid+p.sym); add(n.date,"Earnings",p,`${p.sym} reports${n.timing?" ("+n.timing+")":""}${n.verified===false?" · tentative":""}${n.est!=null?" · EPS est "+n.est.toFixed(2):""}`); } }
    if(p.ac==="fi"){ if(p.x.nextCpn) add(p.x.nextCpn,"Coupon",p,`${p.name} coupon`, p.x.cpnAmt*(p.usd||0)); if(p.x.maturity) add(p.x.maturity,"Maturity",p,`${p.name} matures`, (p.qty||0)*(p.usd||0)); }
    if(p.ac==="cash" && p.x.kind==="td" && p.x.maturity) add(p.x.maturity,"TD maturity",p,`${p.name} matures`, ((p.cost||0)+(p.x.interestAtMat||0))*(p.usd||0));
    if(p.ac==="option" && p.x.expiry) add(p.x.expiry,"Option expiry",p,`${p.name}${p.x.mny!=null?" · "+(p.x.mny>=0?"ITM ":"OTM ")+Math.abs(p.x.mny*100).toFixed(1)+"%":""}`);
    if(p.ac==="sp"){ if(p.x.nextObs) add(p.x.nextObs,"Observation",p,`${p.name} observation${p.x.distA!=null?" · "+(p.x.distA>=0?"above":"below")+" autocall by "+Math.abs(p.x.distA).toFixed(1)+" pts":""}`); if(p.x.maturity) add(p.x.maturity,"Maturity",p,`${p.name} matures`); }
  }
  return ev.sort((a,b)=>a.date.localeCompare(b.date));
}
function buildAlerts(agg){
  const T=th(), t=TODAY(), al=[], pos=agg.pos;
  const a=(sev,cid,text,key)=>al.push({sev,cid,text,key});
  if(S.live.ib.err) a("neg",null,"IBKR: "+S.live.ib.err);
  if(S.live.rh.err) a("neg",null,"Robinhood: "+S.live.rh.err);
  else if(S.live.dataErr) a("warn",null,"Market data: "+S.live.dataErr);
  if(agg.fxMissing.length) a("warn",null,`No FX rate for ${agg.fxMissing.join(", ")}. These holdings are left out of totals until you add a rate in Settings.`);
  const ptSeen=new Set();
  for(const p of pos){
    if(p.dayPct!=null && Math.abs(p.dayPct)*100>=T.dayMove) a(p.dayPct<0?"neg":"info",p.cid,`${p.name} ${pct(p.dayPct)} today`,p.key);
    if(p.ac==="equity" && p.sym && !ptSeen.has(p.cid+p.sym)){
      ptSeen.add(p.cid+p.sym);
      const h=S.pt[p.sym]; if(h?.prevMean && h.mean<h.prevMean && h.changedAt && days(h.changedAt,t)<=7) a("warn",p.cid,`${p.sym} consensus PT cut ${px(h.prevMean)} → ${px(h.mean)} (${fmtDs(h.changedAt)})`,p.key);
      const n=nextEarn(p.sym); if(n && days(t,n.date)<=T.earnDays) a("info",p.cid,`${p.sym} reports in ${days(t,n.date)} days (${fmtDs(n.date)})`,p.key);
    }
    if(p.ac==="fi"){ if(p.x.nextCpn && days(t,p.x.nextCpn)<=T.cpnDays) a("info",p.cid,`${p.name} coupon on ${fmtDs(p.x.nextCpn)}`,p.key); if(p.x.maturity && days(t,p.x.maturity)<=T.cpnDays) a("warn",p.cid,`${p.name} matures ${fmtDs(p.x.maturity)}`,p.key); if(p.px!=null && p.px<80) a("neg",p.cid,`${p.name} priced at ${px(p.px)} (below 80)`,p.key); }
    if(p.ac==="cash" && p.x.kind==="td" && p.x.maturity && days(t,p.x.maturity)<=T.cpnDays) a("warn",p.cid,`${p.name} matures ${fmtDs(p.x.maturity)}${days(t,p.x.maturity)<0?" (past maturity, update or remove)":""}`,p.key);
    if(p.ac==="sp" && p.x.distB!=null && p.x.distB<=T.barrierPts) a(p.x.distB<0?"neg":"warn",p.cid,`${p.name}: worst-of ${p.x.worst.sym} is ${p.x.distB<0?"below":"within "+p.x.distB.toFixed(1)+" pts of"} the ${p.x.barrier}% barrier`,p.key);
    if(p.ac==="option" && p.x.expiry && days(t,p.x.expiry)<=T.optDays && days(t,p.x.expiry)>=0) a("warn",p.cid,`${p.name} expires in ${days(t,p.x.expiry)} days`,p.key);
    if(p.ac==="pe" && (!p.x.navDate || days(p.x.navDate,t)>T.navDays)) a("warn",p.cid,`${p.name} NAV is ${p.x.navDate?days(p.x.navDate,t)+" days old":"undated"}`,p.key);
    if(p.ov && p.ov.at && days(iso(p.ov.at),t)>T.ovDays) a("warn",p.cid,`Override on ${p.name} is ${days(iso(p.ov.at),t)} days old`,p.key);
  }
  if(agg.byClient._unassigned?.n) a("warn",null,`${agg.byClient._unassigned.n} holdings are not assigned to a client. Map accounts in Settings.`);
  const rank={neg:0,warn:1,info:2}; return al.sort((x,y)=>rank[x.sev]-rank[y.sev]);
}

  const c=id?S.clients[id]:{};
  const F=[["name","Client name"],["number","Client number"],["salutation","Salutation (e.g. Dear Your Excellency,)"],["email","Email"],["custodian","Custodian"],["mandate","Mandate / risk profile"],["ytdOpen","Dec 31 portfolio value (USD)","num"],["flowsYtd","Net flows YTD (USD)","num"],["flowsMtd","Net flows MTD (USD)","num"],["income","Income received since inception (USD)","num"]];
  modal(id?"Client details":"Add client", `<div class="form">${F.map(([k,l,t])=>`<label class="f">${l}<input id="cf_${k}" ${t==="num"?'type="number" step="any" inputmode="decimal"':""} value="${esc(c?.[k]??"")}"></label>`).join("")}</div>
    <div class="note">Dec 31 value and flows drive YTD and MTD. MTD otherwise uses the value saved at each Refresh.</div><div class="statusline" id="cfStatus"></div>`,
    `${id?`<button class="btn danger" data-act="delClient" data-v="${esc(id)}" style="margin-right:auto">Delete client</button>`:""}<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="saveClient" data-v="${esc(id||"")}">Save client</button>`);
  modal.fields=F;
}
async function saveClient(id){
  if(!db){ $("#cfStatus").textContent="Saved data is unavailable."; return; }
  const o={}; for(const [k,,t] of modal.fields){ const v=$("#cf_"+k).value.trim(); o[k]= t==="num" ? num(v) : v; }
  if(!o.name){ $("#cfStatus").textContent="Enter the client name."; return; }
  try{ const ref=id?db.doc("clients/"+id):db.collection("clients").doc(); await ref.set(o); closeModal(); toast("Client saved"); }catch(e){ $("#cfStatus").textContent="Could not save. "+(e.code||""); }
}

// ---------- modal ----------
function modal(title, body, foot){
  $("#modalRoot").innerHTML = `<div class="modal-bg" data-act="bgClose"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g,""))}"><div class="modal-h"><h2>${title}</h2><button class="btn sm ghost" data-act="closeModal" aria-label="Close">Close</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:""}</div></div>`;
  const f=$("#modalRoot input:not([readonly]),#modalRoot textarea,#modalRoot select"); if(f) setTimeout(()=>f.focus(),30);
}
function closeModal(){ if(gen) gen.abort(); $("#modalRoot").innerHTML=""; currentDraftId=null; editing=null; }

// ---------- events ----------
const confirmOnce = (btn, label) => { if(btn.dataset.armed){ return true; } btn.dataset.armed="1"; const t=btn.textContent; btn.textContent=label; setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=t; } },4000); return false; };
const ACT = {
  nav:d=>{ closeModal(); if(d.v.startsWith("client:")){ S.view="client"; S.clientId=d.v.slice(7); } else S.view=d.v; window.scrollTo(0,0); render(); },
  ccy:d=>{ S.ccy=d.v; try{ localStorage.setItem("cp_ccy",d.v); }catch(_){} render(); },
  refresh:()=>refresh(true),
  company:d=>openCompany(d.v),
  override:d=>openOverride(d.k), saveOv:d=>saveOv(d.k), clearOv:(d,b)=>{ if(S.overrides[d.k] && confirmOnce(b,"Confirm clear")) clearOv(d.k); },
  skill:d=>openSkill(d.v, d.c, d.k), generate:d=>generate(d.v), stopGen:()=>gen?.abort(),
  copyOut:async()=>{ const t=$("#skOut")?.value||""; try{ await navigator.clipboard.writeText(t); toast("Copied"); }catch(_){ const o=$("#skOut"); o.focus(); o.select(); toast("Selected. Press Ctrl/Cmd+C to copy."); } },
  saveDraft:d=>saveDraft(d.v,false), gmail:d=>toGmail(d.v),
  openDraft:d=>{ const dr=S.drafts[d.v]; if(!dr) return; openSkill(dr.skill, dr.clientId); currentDraftId=d.v; $("#skOutWrap").hidden=false; $("#skOut").value=dr.text||""; if($("#skSubj")) $("#skSubj").value=dr.subject||""; $("#skStatus").textContent=`Saved ${fmtT(dr.at)} · ${dr.status}`; },
  addHolding:d=>openHolding({clientId:d.c||S.clientId||Object.keys(S.clients)[0], ac:"fi"}),
  editHolding:d=>{ const h=S.holdings[d.v]; if(h) openHolding(h); },
  saveHolding:()=>saveHolding(),
  delHolding:async(d,b)=>{ if(!confirmOnce(b,"Confirm delete")) return; try{ await db.doc("holdings/"+d.v).delete(); closeModal(); toast("Holding deleted"); }catch(_){ toast("Could not delete."); } },
  editClient:d=>openClient(d.v), saveClient:d=>saveClient(d.v),
  delClient:async(d,b)=>{ if(!confirmOnce(b,"Delete client? Click again")) return; try{ await db.doc("clients/"+d.v).delete(); closeModal(); S.view="settings"; toast("Client deleted. Their holdings are now unassigned."); }catch(_){ toast("Could not delete."); } },
  saveFx:async()=>{ const fx={...(S.settings.fx||{})}; document.querySelectorAll("[data-fx]").forEach(i=>{ const v=num(i.value); if(v) fx[i.dataset.fx]=v; else delete fx[i.dataset.fx]; }); const nw=($("#fxNew").value||"").trim().toUpperCase(); if(/^[A-Z]{3}$/.test(nw) && !(nw in fx)) fx[nw]=null; await saveSettings({fx}); },
  saveClassMap:async()=>{ const m={}; $("#classMap").value.split(/\n/).forEach(l=>{ const [k,v]=l.split("=").map(s=>(s||"").trim()); if(k && AC[(v||"").toLowerCase()]) m[k.toUpperCase()]=v.toLowerCase(); }); await saveSettings({classMap:m}); },
  saveThresh:async()=>{ const t={}; Object.keys(DEF_TH).forEach(k=>{ const v=num($("#th_"+k).value); if(v!=null) t[k]=v; }); await saveSettings({thresholds:t, basEmail:$("#basEmail").value.trim()}); },
  closeModal:()=>closeModal(), bgClose:(d,b,e)=>{ if(e.target===b) closeModal(); },
};
async function saveSettings(patch){ if(!db){ toast("Saved data is unavailable."); return; } const {id,...cur}=S.settings; try{ await db.doc("meta/settings").set({...cur,...patch}); toast("Saved"); }catch(_){ toast("Could not save settings."); } }
document.addEventListener("click", e=>{ const t=e.target.closest("[data-act]"); if(!t) return; const f=ACT[t.dataset.act]; if(!f) return; if(t.dataset.act!=="bgClose") e.preventDefault(); const m=t.closest("details.menu"); if(m) m.open=false; f(t.dataset,t,e); });
document.addEventListener("change", async e=>{
  const t=e.target.closest("[data-chg]"); if(!t) return; const k=t.dataset.chg;
  if(k==="mapAcct"){ if(!db) return; try{ await db.doc("accounts/"+t.dataset.v).set({clientId:t.value||null}); toast("Account mapped"); }catch(_){ toast("Could not save the mapping."); } }
  if(k==="draftStatus"){ if(!db) return; try{ await db.doc("drafts/"+t.dataset.v).update({status:t.value, statusAt:Date.now()}); }catch(_){ toast("Could not update the status."); } }
  if(k==="hfAc"){ editing={...readHolding(), ac:t.value}; $("#modalRoot .modal-b").innerHTML=holdingForm(editing); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#modalRoot").innerHTML) closeModal(); });
document.addEventListener("toggle", e=>{ if(e.target.matches?.("details.menu") && e.target.open) document.querySelectorAll("details.menu[open]").forEach(m=>{ if(m!==e.target) m.open=false; }); }, true);

// ---------- boot ----------
try{ const c=localStorage.getItem("cp_ccy"); if(c==="SAR"||c==="USD") S.ccy=c; }catch(_){}
render();
(async()=>{
  const use = n => (window.claude && typeof window.claude.use==="function") ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  [mcp, db, user, sample] = await Promise.all([use("mcp"), use("db"), use("user"), use("sample")]);
  S.mcpState = mcp ? "ok" : "none"; S.sampleOK=!!sample;
  if(user){ try{ S.me = await user.id(); }catch(_){} }
  if(db){
    S.dbState="ok";
    for(const [p,k] of [["clients","clients"],["accounts","accounts"],["holdings","holdings"],["overrides","overrides"],["drafts","drafts"],["snapshots","snapshots"],["audit","audit"]]) sub(p,k);
    db.doc("meta/settings").onSnapshot(s=>{ S.settings=s.exists?s.data():{}; render(); }, ()=>{});
    db.doc("meta/pt").onSnapshot(s=>{ S.pt=s.exists?s.data():{}; render(); }, ()=>{});
  } else S.dbState="none";
  render();
  if(mcp) refresh(false);
})();
})();
</script>
