name: brief-send
on:
  schedule:
    # Every 7 minutes from 06:03 to 07:45 UTC (09:03-10:45 Riyadh), off the top of the hour.
    # Repeat runs are no-ops once sent/<DD.MM.YYYY>-<mode>.json exists.
    - cron: "3-59/7 6 * * *"
    - cron: "3-45/7 7 * * *"
  workflow_run:
    workflows: [market-data]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: brief-send
  cancel-in-progress: false
jobs:
  send:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      RECIPIENTS_TEST: ${{ secrets.RECIPIENTS_TEST }}
      RECIPIENTS_LIVE: ${{ secrets.RECIPIENTS_LIVE }}
      BRIEF_MODE: ${{ vars.BRIEF_MODE || 'test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # after market-data, take the branch tip so its fresh commit is included
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look for today's package
        id: detect
        run: python3 mailer.py detect
      - name: Install build tools
        if: steps.detect.outputs.found == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils libpango-1.0-0 libpangoft2-1.0-0 fontconfig fonts-inter fonts-ibm-plex
          pip install -q weasyprint==70.0 matplotlib==3.11.2 numpy==2.5.3 pillow pydyf==0.12.1
          mkdir -p ~/.fonts ~/.config/fontconfig
          for w in Regular Medium SemiBold Bold ExtraBold; do cp /usr/share/fonts/opentype/inter/Inter-$w.otf ~/.fonts/; done
          for w in Regular Medium SemiBold Bold; do cp /usr/share/fonts/truetype/ibm-plex/IBMPlexMono-$w.ttf ~/.fonts/; done
          cp kit/fonts.conf ~/.config/fontconfig/fonts.conf
          base64 -d kit/wordmark.b64 > kit/wordmark.png
          base64 -d kit/circles.b64 > kit/circles.png
          fc-cache -f
      - name: Build, check and send
        if: steps.detect.outputs.found == 'true'
        run: python3 mailer.py send
      - name: Record result
        if: always()
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          mkdir -p sent
          git add sent/
          git diff --cached --quiet && { echo "nothing to record"; exit 0; }
          git commit -m "brief status $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 5))
          done
          exit 1
