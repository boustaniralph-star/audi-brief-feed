name: market-data
on:
  schedule:
    # Off the top of the hour (GitHub delays or drops :00 schedules under load), two slots for redundancy.
    # 07:17 and 07:47 Riyadh. The second slot is a no-op once market_data.json has today's generatedAt.
    - cron: "17 4 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refetch even if market_data.json is already from today"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schedule heartbeat
        if: github.event_name == 'schedule'
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ github.event_name }} cron=\"$CRON\"" >> heartbeat.log
          tail -n 30 heartbeat.log > heartbeat.tmp && mv heartbeat.tmp heartbeat.log
          tail -n 1 heartbeat.log
      - name: Fetch market data
        id: fetch
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 fetch_market_data.py
      - name: Build series.json
        id: series
        run: python3 make_series.py
      - name: Commit
        # always() so the heartbeat is recorded even when the fetch fails; market data is only
        # committed when both data steps succeeded
        if: always()
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          if [ -f heartbeat.log ]; then git add heartbeat.log; fi
          msg="heartbeat $(date -u +%Y-%m-%d)"
          if [ "${{ steps.fetch.outcome }}" = success ] && [ "${{ steps.series.outcome }}" = success ]; then
            git add market_data.json series.json market_data/
            msg="market data $(date -u +%Y-%m-%d)"
          fi
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "$msg"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 5))
          done
          exit 1
