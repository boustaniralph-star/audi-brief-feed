<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Reproduces the font resolution of the original build environment: CSS families I and M both resolve to Inter. -->
  <match target="pattern"><test name="family"><string>I</string></test><edit name="family" mode="assign" binding="strong"><string>Inter</string></edit></match>
  <match target="pattern"><test name="family"><string>M</string></test><edit name="family" mode="assign" binding="strong"><string>Inter</string></edit></match>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
