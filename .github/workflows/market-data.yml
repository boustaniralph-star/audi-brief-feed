name: market-data
on:
  schedule:
    - cron: "0 5 * * *"      # 08:00 Riyadh, daily (GitHub may start it up to ~30 min late)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch market data
        run: python3 fetch_market_data.py
      - name: Build series.json
        run: python3 make_series.py
      - name: Commit
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add market_data.json series.json market_data/
          git diff --cached --quiet || git commit -m "market data $(date -u +%Y-%m-%d)"
          git push
